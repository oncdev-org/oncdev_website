<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oncdev-dots</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="theme-dark">
  <!-- Particles Canvas Container -->
  <div id="particles-container"></div>
  
  <!-- UI Layout -->
  <div class="app-layout">
    <!-- Floating Show Controls Button -->
    <button id="show-controls-btn" class="floating-gear-btn" style="display: none;" title="Show Controls">
      <svg viewBox="0 0 24 24" fill="none" style="width: 20px; height: 20px;" xmlns="http://www.w3.org/2000/svg">
        <path d="M19.14 12.94C19.18 12.63 19.2 12.32 19.2 12C19.2 11.68 19.18 11.37 19.14 11.06L21.16 9.48C21.34 9.34 21.39 9.08 21.28 8.87L19.36 5.55C19.25 5.34 18.99 5.26 18.78 5.34L16.4 6.3C15.9 5.92 15.37 5.61 14.8 5.38L14.44 2.84C14.41 2.62 14.22 2.46 14 2.46H10.16C9.94 2.46 9.75 2.62 9.72 2.84L9.36 5.38C8.79 5.61 8.26 5.92 7.76 6.3L5.38 5.34C5.17 5.26 4.91 5.34 4.8 5.55L2.88 8.87C2.77 9.08 2.82 9.34 3 9.48L5.02 11.06C4.98 11.37 4.96 11.68 4.96 12C4.96 12.32 4.98 12.63 5.02 12.94L3 14.52C2.82 14.66 2.77 14.92 2.88 15.13L4.8 18.45C4.91 18.66 5.17 18.74 5.38 18.66L7.76 17.7C8.26 18.08 8.79 18.39 9.36 18.62L9.72 21.16C9.75 21.38 9.94 21.54 10.16 21.54H14C14.22 21.54 14.41 21.38 14.44 21.16L14.8 18.62C15.37 18.39 15.9 18.08 16.4 17.7L18.78 18.66C18.99 18.74 19.25 18.66 19.36 18.45L21.28 15.13C21.39 14.92 21.34 14.66 21.16 14.52L19.14 12.94ZM12 15.6C10.01 15.6 8.4 13.99 8.4 12C8.4 10.01 10.01 8.4 12 8.4C13.99 8.4 15.6 10.01 15.6 12C15.6 13.99 13.99 15.6 12 15.6Z" fill="currentColor"/>
      </svg>
    </button>

    <!-- Main Branding Header -->
    <header class="branding-header">
      <h1 class="main-title">oncdev Dots</h1>
    </header>

    <!-- Side Control Panel -->
    <main class="control-panel-wrapper">
      <div class="control-card" id="control-card">
        <div class="card-header">
          <span class="card-title">Simulation Control</span>
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="theme-toggle-wrapper">
            <button id="theme-btn-dark" class="theme-btn active" title="Dark Theme">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3C10.5 4.5 9.5 6.5 9.5 9C9.5 13.5 13 17 17.5 17C18.5 17 19.5 16.7 20.5 16.2C19 19.5 15.7 21.5 12 21.5C6.8 21.5 2.5 17.2 2.5 12C2.5 7.2 6.1 3.3 12 3Z" fill="currentColor"/>
              </svg>
            </button>
            <button id="theme-btn-light" class="theme-btn" title="Light Theme">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="5" fill="currentColor"/>
                <path d="M12 2V4M12 20V22M4 12H2M22 12H20M19.07 4.93L17.66 6.34M6.34 17.66L4.93 19.07M19.07 19.07L17.66 17.66M6.34 6.34L4.93 4.93" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <button id="close-card-btn" class="close-btn" title="Hide Controls">×</button>
          </div>
        </div>

        <div class="control-groups">
          <!-- Parameter Sliders -->
          <div class="control-group">
            <div class="slider-label-row">
              <label for="density-slider">Density (Spacing)</label>
              <span id="density-val" class="val-display">200</span>
            </div>
            <input type="range" id="density-slider" min="100" max="300" step="10" value="200" class="premium-slider">
          </div>

          <div class="control-group">
            <div class="slider-label-row">
              <label for="scale-slider">Particle Size</label>
              <span id="scale-val" class="val-display">0.75</span>
            </div>
            <input type="range" id="scale-slider" min="0.2" max="2.0" step="0.05" value="0.75" class="premium-slider">
          </div>

          <div class="control-group">
            <div class="slider-label-row">
              <label for="displacement-slider">Interaction Displacement</label>
              <span id="displacement-val" class="val-display">0.15</span>
            </div>
            <input type="range" id="displacement-slider" min="0.01" max="0.5" step="0.01" value="0.15" class="premium-slider">
          </div>

          <div class="control-group">
            <div class="slider-label-row">
              <label for="radius-slider">Interaction Radius</label>
              <span id="radius-val" class="val-display">0.11</span>
            </div>
            <input type="range" id="radius-slider" min="0.01" max="0.25" step="0.005" value="0.11" class="premium-slider">
          </div>

          <div class="control-group">
            <div class="slider-label-row">
              <label for="delay-slider">Cursor Delay</label>
              <span id="delay-val" class="val-display">50</span>
            </div>
            <input type="range" id="delay-slider" min="0" max="100" step="1" value="50" class="premium-slider">
          </div>

          <!-- Toggle options -->
          <div class="control-group checkbox-group">
            <label class="premium-checkbox-container" for="autopilot-toggle">
              <input type="checkbox" id="autopilot-toggle" checked>
              <span class="checkbox-checkmark"></span>
              Autopilot Mode (Self-moving cursor)
            </label>
          </div>

          <!-- Color Customizer -->
          <div class="control-group border-top">
            <span class="group-title">Gradient Color Scheme</span>
            <div class="color-inputs-row">
              <div class="color-picker-wrapper">
                <input type="color" id="color1-picker" value="#7189ff" class="color-input">
                <label for="color1-picker">Color 1</label>
              </div>
              <div class="color-picker-wrapper">
                <input type="color" id="color2-picker" value="#3074f9" class="color-input">
                <label for="color2-picker">Color 2</label>
              </div>
              <div class="color-picker-wrapper">
                <input type="color" id="color3-picker" value="#000000" class="color-input">
                <label for="color3-picker">Color 3</label>
              </div>
            </div>
            <button id="reset-colors-btn" class="secondary-btn">Reset Colors to Theme Defaults</button>
          </div>
        </div>

        <div class="card-footer">
          <div class="tech-spec">
            <div class="spec-item">
              <span class="spec-label">Simulation Buffer:</span>
              <span class="spec-value">256 × 256 Float32</span>
            </div>
            <div class="spec-item">
              <span class="spec-label">Particles Count:</span>
              <span id="particles-count-val" class="spec-value">...</span>
            </div>
          </div>
        </div>
      </div>
    </main>


  </div>

  <!-- Main JavaScript File -->
  <script src="app.js"></script>
</body>
</html>
